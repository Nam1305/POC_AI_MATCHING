services:
  ai-service:
    build: ./MVP_AI_Matching
    container_name: ai-service
    env_file: ./MVP_AI_Matching/.env
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Internal-only in production. Uncomment to expose for debugging:
    # ports:
    #   - "8000:8000"

  web:
    build: ./test-ai
    container_name: test-ai-web
    env_file: ./test-ai/.env
    environment:
      NUXT_AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "3002:3000"
    restart: unless-stopped
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
